<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>カスタムルーレット</title>

    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.0/html2canvas.min.js"></script>

    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6JWCGLCKMB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-6JWCGLCKMB');
    </script>

</head>

<body>
    <div id="customRouletteTitle">カスタムルーレット</div>
    <div id="welcomeMessage">
        <p>　　～ルーレットの特徴～<br>
            　・簡単に項目を増やせます。<br>
            　・CSVファイルを読み込めます。<br>
            　・当選倍率を変更できます。<br>
            　・当選者カードを作成できます。<br>
            　　・メッセージ編集可能。<br>
            　　・スクリーンショット可能。<br>
            　　詳しくは右上のボタンから！<br>
            　★楽しいルーレットライフを！
        </p>
    </div>

    <div id="pointedText">テキストがここに表示されます</div>
    <div id="inputTag">【項目入力欄】
        <button id="exampleInputButton">入力例</button>
        <button id="descriptionInputButton">使用法</button>
    </div>
    <textarea id="inputArea"
        placeholder="項目入力欄。入力方法は［入力例］ボタンを押してください。また、CSVファイルをここにドラッグアンドドロップして項目を読み込むことも可能です。"></textarea>
    <div id="clearInputTag">
        <button id="historyButton">履歴表示</button>
        <button id="randomizeButton">ランダム</button>
        <button id="clearInputButton">項目全削除</button>
    </div>
    <div id="dragContainer">
        <div id="dragHandle"></div> 
        <div id="checkButtonsWrap">
            <button id="checkAllBtn" class="smallButton checkAll">全表示</button>
            <button id="uncheckAllBtn" class="smallButton uncheckAll">全非表示</button>
        </div>
        <div id="checkBoxList"></div>
    </div>
    <div id="sizeSliderTag">サイズ</div>
    <input id="sizeSlider" type="range" min="200" max="350" value="250">
    <div id="rouletteSettings">
        <label><input type="checkbox" id="soundToggle"> サウンドON</label><br>
        <label><input type="checkbox" id="autoDisableToggle" checked> 当選項目を自動OFF</label>
    </div>

    <div id="diskContainer" style="text-align: center;">
        <canvas id="diskCanvas" width="900" height="800"></canvas>
    </div>
    <button id="toggleButton" class="button startButton">スタート</button>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div id="modalTopText" class="modal-top-text"></div>
            <div id="modalText" class="modal-text"></div>
            <div id="modalBottomText" class="modal-bottom-text"></div>
            <img src="./happyCard.jpg" alt="Result Image" class="modal-image">
        </div>
        <button id="saveImageBtn" class="button">画像を保存</button>
    </div>

    <div id="textOverlayInputContainer">
        <textarea id="textOverlayInput" placeholder="ここにテキストを入力"></textarea>

        <div id="insertSampleTextWrap">
            <button id="insertSampleTextButton">サンプルテキストを入力</button>
        </div>
    </div>

    <div id="cardEditToggleWrap">
        <button id="toggleTextOverlayInputContainerButton">結果表示カード編集</button>
    </div>

    <div id="historyContainer">
        <div style="font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">当選履歴</div>
        <div id="historyList"></div>
    </div>

    <div id="footerCredit">&copy; 2026 Rela ・ v2.3.1</div>
    <script src="main.js"></script>

</body>

</html>
