  <script> 
    //CSV形式ファイル読み込み
    const inputArea = document.getElementById('inputArea');

    inputArea.addEventListener('dragover', (event) => {
      event.preventDefault();
    });

    inputArea.addEventListener('drop', (event) => {
      event.preventDefault();
      const file = event.dataTransfer.files[0];

      // ファイルがCSVでない場合はアラートを表示
      if (!file.type.includes('csv') && !file.name.endsWith('.csv')) {
        alert('CSVファイルをドロップしてください。');
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          // ファイルの内容をArrayBufferとして読み込む
          const arrayBuffer = event.target.result;
          // TextDecoderを使用してデコード
          // 注意: ここで'utf-8'や'shift-jis'など、適切なエンコーディングを指定する
          const decoder = new TextDecoder('shift-jis');
          const text = decoder.decode(new Uint8Array(arrayBuffer));
          // CSVの内容を改行で分割してテキストエリアにセット
          const formattedText = text.split(',').join('\n');
          inputArea.value = formattedText;

          texts = document.getElementById('inputArea').value.trim().split('\n');
          updateCheckBoxList();
          recalculateSegmentsAndDraw();
          
        } catch (e) {
          // デコードや処理中にエラーが発生した場合
          console.error("ファイルの読み込みに失敗しました: ", e);
          alert('ファイルの読み込みに失敗しました。');
        }
      };

      // ファイルの読み込みを実行
      reader.readAsArrayBuffer(file);
    });

    document.getElementById('randomizeButton').addEventListener('click', function() {
      
        // テキストエリアの内容を行ごとに分割し、項目名と倍率を分離
        const inputTexts = document.getElementById('inputArea').value.trim().split('\n');
        const itemsWithMultipliers = inputTexts.map(text => {
            const [item, multiplier] = text.split('/');
            return {item, multiplier};
        });

        // ランダムにシャッフルする関数（Fisher-Yates Shuffle）
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 項目名だけをランダムにシャッフル
        shuffle(itemsWithMultipliers);

        // シャッフルされた項目名をテキストエリアに再設定
        const randomizedText = itemsWithMultipliers.map(({item, multiplier}) => multiplier ? `${item}/${multiplier}` : item).join('\n');
        document.getElementById('inputArea').value = randomizedText;

        // チェックボックスリストと円盤を更新
        texts = randomizedText.split('\n');
        updateCheckBoxList();
        recalculateSegmentsAndDraw();
    });

    function saveCheckBoxState() {

    function updateCheckBoxList() {
        const checkBoxList = document.getElementById('checkBoxList');
        checkBoxList.innerHTML = '';
        texts.forEach((text) => {
            const textWithoutMultiplier = text.split('/')[0];
            const wrapper = document.createElement('div');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = segmentVisibility[text] !== false; // 復元された状態またはデフォルトの状態を使用

                segmentVisibility[text] = checkbox.checked;
                saveCheckBoxState(); // チェック状態を保存
                recalculateSegmentsAndDraw();
            };
            wrapper.appendChild(checkbox);

            const label = document.createElement('label');
            label.textContent = textWithoutMultiplier;
            wrapper.appendChild(label);

            checkBoxList.appendChild(wrapper);
        });
    }

              lastUpdateTime = Date.now();
              requestAnimationFrame(spinDisk);
          } else {
              spinning = false;
              // ストップが押された時点ではボタンを無効化しない
          }
      });


      function spinDisk() {
          const now = Date.now();
          const deltaTime = now - lastUpdateTime;
          const toggleButton = document.getElementById('toggleButton');

          if (spinning) {
              spinSpeed = Math.min(spinSpeed + spinAcceleration, maxSpinSpeed);
          } else {
              // スピニングが終了した場合、慣性による減速を適用
              spinSpeed *= inertiaDecay;
              //spinSpeed -= spinDeceleration;

              if (spinSpeed <= 0.00005) {
                  spinSpeed = 0;
                  toggleButton.textContent = "スタート";
                  toggleButton.className = 'button startButton';
                  toggleButton.disabled = false; // 停止後にボタンを再度有効化
                  randomizeButton.disabled = false;
                  clearInputButton.disabled = false;
                  showModal(pointedText.textContent);
                  return;
              }
              // 減速中はボタンを無効化
            toggleButton.disabled = true;
          }

          angleOffset += (spinSpeed * deltaTime) % (2 * Math.PI);
          recalculateSegmentsAndDraw();
          lastUpdateTime = now;
          if (spinSpeed > 0) requestAnimationFrame(spinDisk);
      }


      // グローバル変数の定義部分に visibleTexts を追加
      let visibleTexts = [];

      // recalculateSegmentsAndDraw 関数内で visibleTexts を更新
    

      function recalculateSegmentsAndDraw() {        
          visibleTexts = texts.filter(text => segmentVisibility[text] !== false);
          const totalMultiplier = visibleTexts.reduce((total, text) => total + parseMultiplier(text), 0);
          const baseAngle = (2 * Math.PI) / totalMultiplier;
          let currentAngle = 0;

          // キャンバスをクリア
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // 円盤の基盤（縁とシャドウ）を描画
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius + 5, 0, Math.PI * 2, false);
          ctx.fillStyle = '#adff2f'; // 縁の色
          ctx.fill();

          // シャドウの設定
          ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
          ctx.shadowBlur = 10;
          ctx.shadowOffsetX = 5;
          ctx.shadowOffsetY = 5;

          // 円盤のセグメントを描画
          visibleTexts.forEach(text => {
              const multiplier = parseMultiplier(text);
              const segmentAngle = baseAngle * multiplier;
              const startAngle = currentAngle;
              const endAngle = currentAngle + segmentAngle;
              drawSegment(startAngle + angleOffset, endAngle + angleOffset, `hsl(${(currentAngle / (2 * Math.PI)) * 360}, 100%, 50%)`, text.split('/')[0]);
              currentAngle += segmentAngle;
          });

          // シャドウ設定をリセット
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 0;

          drawPointer();
          updatePointedText(); // visibleTexts を使用してポインターが指すテキストを更新
      }

      function drawSegment(angleStart, angleEnd, color, text) {
          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.arc(centerX, centerY, radius, angleStart, angleEnd);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();

          // セグメントの中心角を計算
          const midAngle = (angleStart + angleEnd) / 2;

          // テキスト描画位置の計算（セグメントの外側に向かって少しオフセットを与える）
          const textRadius = radius * 0.6; // テキストを円盤の中心から少し外側に配置
          const textX = centerX + textRadius * Math.cos(midAngle);
          const textY = centerY + textRadius * Math.sin(midAngle);

          // テキストのスタイル設定
          ctx.fillStyle = 'black';
          ctx.font = '20px Arial';
          ctx.textAlign = 'center'; // テキストを横方向の中心に
          ctx.textBaseline = 'middle'; // テキストを縦方向の中心に

          // テキスト描画
          ctx.fillText(text, textX, textY);
      }



      function drawPointer() {
          const pointerWidth = 50; // ポインターの横幅を定義
          const pointerHeight = 10; // ポインターの高さを定義
          ctx.beginPath();
          // ポインターの起点
          ctx.moveTo(centerX + radius - 20, centerY);
          // ポインターの右側の点
          ctx.lineTo(centerX + radius + 20 + pointerWidth, centerY - pointerHeight);
          // ポインターの左側の点
          ctx.lineTo(centerX + radius + 20 + pointerWidth, centerY + pointerHeight);
          ctx.closePath();
          // ポインターの色とシャドウの設定
          ctx.fillStyle = 'red';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.5)'; // シャドウの色
          ctx.shadowBlur = 5; // シャドウのぼかし量
          ctx.shadowOffsetX = 3; // シャドウのX方向のオフセット
          ctx.shadowOffsetY = 3; // シャドウのY方向のオフセット
          ctx.fill();
          // シャドウ設定をリセット
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 0;
      }



      // updatePointedText 関数の修正

    function updatePointedText() {
        // 中心から右30pxの位置の角度を計算
        const targetX = 30; // 中心から右30px
        const targetY = 0; // Yは0（中心線上）
        // 回転後の位置にあるポイントの相対角度を計算
        const pointAngle = Math.atan2(targetY, targetX);

        // 角度の調整：angleOffsetを正の値に正規化し、2π（360度）で割った余りを取る
        const normalizedAngleOffset = (angleOffset % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        // ポイントが現在指しているセグメントを特定するための角度
        const adjustedAngle = (pointAngle - normalizedAngleOffset + 2 * Math.PI) % (2 * Math.PI);

        // テキスト表示要素を取得してテキストを太くする
        /*const pointedTextElement = document.getElementById('pointedText');
        pointedTextElement.style.fontWeight = 'bold'; // テキストを太くする*/

        let currentAngle = 0;
        let foundText = "テキストエリアに、項目と倍率を書いて下さい。";
        visibleTexts.forEach(text => {
            const multiplier = parseMultiplier(text);
            // 一周した際に正しくセグメントをカウントするための全体の倍率を取得
            const totalMultiplier = visibleTexts.reduce((acc, val) => acc + parseMultiplier(val), 0);
            const segmentAngle = (2 * Math.PI) * multiplier / totalMultiplier;

            // 指定された角度が現在のセグメントに含まれるかチェック
            if (adjustedAngle >= currentAngle && adjustedAngle < currentAngle + segmentAngle) {
                foundText = text.split('/')[0]; // "/" で分割し最初の部分を取得
            }
            currentAngle += segmentAngle; // 次のセグメントの角度へ
        });

        document.getElementById('pointedText').textContent = foundText;
    }

    //モーダル上のテキストの大きさ
    function adjustFontSizeForModalText() {
      const modalText = document.querySelector('.modal-text');
      const maxModalContent = 570;
      const initialFontSize = 75; // 常にこの値からフォントサイズの調整を開始

      // フォントサイズを初期値にリセット
      modalText.style.fontSize = `${initialFontSize}px`;

      // リセット後にテキストの横の長さを測定
      const initialWidth = modalText.scrollWidth;
      console.log(`テキストの初期の横の長さ: ${initialWidth}px、初期フォントサイズ: ${initialFontSize}px`);

      let fontSize = initialFontSize;
      // テキストがモーダルコンテンツの幅を超える場合、フォントサイズを調整
      while (modalText.scrollWidth > maxModalContent && fontSize > 10) {
        fontSize -= 1; // フォントサイズを徐々に小さくする
        modalText.style.fontSize = `${fontSize}px`;
      }

      console.log(`調整後のフォントサイズ: ${fontSize}px`);
    }

    // テキストエリアの入力イベントリスナー
    document.getElementById('textOverlayInput').addEventListener('input', function() {
